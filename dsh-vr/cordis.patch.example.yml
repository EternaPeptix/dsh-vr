# Example bundle patch. Copy to cordis.patch.yml and set your own paths.
#
# cordis.patch.yml is gitignored on purpose: it names the engagement workspace, the hosts denied for
# that engagement, and absolute paths that are specific to one machine.
- insert:
    - id: vr-harness
      name: dsh-vr
      config:
        enabled: true
        root: research
        telemetry: true
        enrich: true
        # Absolute path to this workspace's research directory.
        enrichRoot: "/absolute/path/to/your/research"
        # The key that seals research/journal.jsonl. Empty means ~/.dsh-vr/journal.key, created on the
        # first write. Keep it outside the workspace, and back it up with the journal.
        journalKeyFile: ""
        deniedHosts: "vendor-a.example,vendor-b.example"
        enforceAllowedHosts: true
        referenceHosts: ""
        # Loopback stays reachable so local reproducers work without a scope edit. Set false when the
        # engagement must not run local servers.
        allowLoopback: true
        # Extra Host values the findings dashboard may be served under. Leave empty unless you put a
        # tunnel in front of it; loopback Hosts are always accepted.
        dashboardAllowHosts: ""
        dashboardCacheMs: 1500
        questionTimeoutSeconds: 300
        redirectQuestionTool: true
        goalDiscipline: true
        goalBlockPolicy: never
        fanoutCeiling: 24

- id: subagent
  config:
    maxDepth: 3
    maxActiveSubagents: 24

- id: skill-filesystem
  name: "@deepseek-ai/dsh-skill-filesystem"
  disabled: false
  config:
    includeDefaultRoots: false
    watch: true
    customSkillDirs:
      - "/absolute/path/to/your/research/skills"
